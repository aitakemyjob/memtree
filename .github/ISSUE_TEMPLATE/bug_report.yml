name: Bug report
description: Something in memtree doesn't work as expected.
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please search [existing issues](https://github.com/aitakemyjob/memtree/issues) first.
        **Security problems:** please don't file them here — see [SECURITY.md](https://github.com/aitakemyjob/memtree/security/policy).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
      placeholder: "After a Claude Code session ended, the capture never showed up under Captures..."
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `memtree install claude-code`
        2. Start a session and ask ...
        3. See ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: memtree version
      description: Run `memtree version`, or see the bottom-right of the status bar.
      placeholder: v0.1.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Windows, Linux, Other]
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: How are you running it?
      options: [Desktop app, "Browser (memtree serve)", MCP only (memtree mcp)]
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Memories (search, edit, scoring)
        - Lattice (categories, probe, tagging)
        - Hooks / capture (Claude Code, Codex, Cursor, VS Code)
        - Consolidation / decay
        - Agent / MCP tools
        - Timeline / Activity views
        - Settings
        - Install / packaging
        - Other
  - type: input
    id: agent
    attributes:
      label: Agent / MCP client (if relevant)
      placeholder: Claude Code 2.x, Cursor, VS Code...
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Terminal output, browser console errors (for `serve`), or screenshots. Please remove anything private.
      render: shell
